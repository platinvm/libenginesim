name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Only the two submodules the physics and audio need. A recursive clone
      # would drag in the renderer, the scripting engine and the video tooling,
      # none of which this library compiles.
      - name: Check out upstream
        run: |
          git submodule update --init vendor/engine-sim
          git -C vendor/engine-sim submodule update --init \
              dependencies/submodules/simple-2d-constraint-solver

      - name: Build
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j$(nproc)

      - name: Test
        run: ctest --test-dir build --output-on-failure

      # The header is the product, so it is checked as one rather than only as
      # a side effect of building the library.
      - name: Check the header compiles standalone
        run: |
          for std in c99 c11 c17; do
            printf '#include "enginesim.h"\nint main(void){return (int)es_abi_version();}\n' > /tmp/h.c
            gcc -std=$std -Wall -Wextra -Wpedantic -Iinclude -c /tmp/h.c -o /dev/null
          done
          for std in c++11 c++17; do
            printf '#include "enginesim.h"\nint main(){return (int)es_abi_version();}\n' > /tmp/h.cpp
            g++ -std=$std -Wall -Wextra -Wpedantic -Iinclude -c /tmp/h.cpp -o /dev/null
          done

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Exercises the committed bundle the demo actually serves, in a bare
      # AudioWorkletGlobalScope lookalike: no window, self, document, fetch or
      # performance. Two seconds, no Emscripten toolchain needed.
      - name: Worklet tests
        run: node tests/worklet.mjs

  pages:
    name: Deploy the demo
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    # A half-finished deploy is worse than a queued one, so this group does not
    # cancel, unlike the workflow-level one above.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      # The demo needs the page, the binding and the bundle, and nothing else.
      # The layout has to match the repository so demo/app.js resolves
      # ../bindings/js/enginesim.js the same way it does locally.
      - name: Assemble the site
        run: |
          mkdir -p _site/bindings/js
          cp index.html _site/
          cp -r demo _site/
          cp bindings/js/enginesim.js \
             bindings/js/enginesim.d.ts \
             bindings/js/enginesim-worklet.js _site/bindings/js/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5
