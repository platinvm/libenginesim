name: Release

# Publishing is deliberately manual: push a v* tag whose version matches
# package.json. The tag is the only trigger, so nothing reaches npm by
# accident on a merge.
on:
  push:
    tags: ['v*']

env:
  EMSDK_VERSION: 6.0.5

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets npm attach a provenance attestation tying the tarball to this
      # workflow run and commit. Costs nothing and is worth having.
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Check out upstream
        run: |
          git submodule update --init vendor/engine-sim
          git -C vendor/engine-sim submodule update --init \
              dependencies/submodules/simple-2d-constraint-solver

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          tag=${GITHUB_REF_NAME#v}
          pkg=$(npm pkg get version | tr -d '"')
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg"
            exit 1
          fi
          echo "publishing $pkg"

      - name: Install the Emscripten SDK
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git ~/emsdk
          ~/emsdk/emsdk install ${{ env.EMSDK_VERSION }}
          ~/emsdk/emsdk activate ${{ env.EMSDK_VERSION }}

      # Never publish a bundle that was not built from the tagged sources.
      - name: Rebuild the worklet bundle and verify it matches
        run: |
          source ~/emsdk/emsdk_env.sh
          cp bindings/js/enginesim-worklet.js /tmp/committed.js
          emcmake cmake -B build-wasm -DCMAKE_BUILD_TYPE=Release
          cmake --build build-wasm -j$(nproc)
          cmp /tmp/committed.js bindings/js/enginesim-worklet.js \
            || { echo "::error::committed bundle is stale; rebuild and re-tag"; exit 1; }

      - name: Worklet tests
        run: node tests/worklet.mjs

      - name: Publish
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
